name: Python App CI & CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black Code Formatter Check
        run: black --check .

      - name: Run Flake8 Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest suite with Coverage Gate (85% minimum)
        env:
          APP_ENV: "ci_test_runner"
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Simulate Secure Production Deployment
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Connecting securely with user: $DB_USER"
          echo "Deploying application with authenticated database channel..."
          echo "Deployment successful!"