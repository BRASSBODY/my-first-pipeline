name: Python App CI & CD

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Linting and Testing
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Run flake8 code linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest unit tests
        run: pytest

  # Job 2: Simulated Continuous Deployment
  deploy:
    needs: build-and-test  # Enforces that deploy only runs if build-and-test passes
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Production Deployment
        env:
          # Reads secret securely from repository settings
          DEPLOY_ENV: "production"
        run: |
          echo "Connecting to $DEPLOY_ENV environment..."
          echo "Build passed all quality gates and tests. Deployment complete!"